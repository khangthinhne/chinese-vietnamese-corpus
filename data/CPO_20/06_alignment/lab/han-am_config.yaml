dataset:
  name: CPO_20_parallel
  input_file: E:/Projects/han-viet-corpus/data/CPO_20/06_alignment/lab/han-am_input.csv
  columns:
    encoding: utf-8-sig
    sinonom_column: HanNom
    quocngu_column: DichAm
    fallback_column: null
    id_column: ID
dictionary:
  translation_dict: E:/Projects/han-viet-corpus/third_party/SN-QN-alignment/dict/QuocNgu_SinoNom_TongHop3.csv
  similarity_dict: E:/Projects/han-viet-corpus/third_party/SN-QN-alignment/dict/SinoNom_Similar_Dic_v2.csv
